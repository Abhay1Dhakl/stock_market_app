previews:
  generation: off

services:
  - type: keyvalue
    name: stock-market-redis
    plan: free
    ipAllowList: []

  - type: web
    name: stock-market-api
    runtime: python
    plan: free
    region: oregon
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - data/seed/**
        - render.yaml
        - .python-version
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stock-market-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stock-market-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: BACKEND_CORS_ORIGIN_REGEX
        value: https://[a-zA-Z0-9-]+\\.vercel\\.app
      - key: BOOTSTRAP_DEFAULT_ADMIN
        value: "true"
      - key: BOOTSTRAP_ADMIN_NAME
        value: System Administrator
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: CATEGORIZATION_PROVIDER
        value: rule_based

databases:
  - name: stock-market-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: stock_market
    user: stock_user
    diskSizeGB: 1
    ipAllowList: []
